<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Job - Software Engineer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #F5F7FA;
      color: #333333;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="container mx-auto p-6">
  <div class="bg-white shadow-md rounded-lg p-6 hover:shadow-lg transition-shadow">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Software Engineer</h1>
    <div class="flex items-center text-gray-600 mb-4">
      <span class="mr-2">Tech Corp</span>
      <span class="text-gray-400">•</span>
      <span>San Francisco, CA</span>
    </div>
    <div class="mb-4">
      <p class="text-gray-700">Salary: $50,000 - $65,000 USD</p>
      <span class="inline-block bg-green-200 text-green-800 text-xs px-2 py-1 rounded-full mt-1">
        3 days ago
      </span>
    </div>
    <div class="description__text">
      <p class="text-gray-600">Job description: Develop software solutions for our team. Apply now to join our team!</p>
    </div>
    <a href="#" class="mt-4 inline-block text-primary hover:underline">View Original Post</a>
  </div>
</body>
</html>
